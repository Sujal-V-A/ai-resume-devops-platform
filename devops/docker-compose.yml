version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: devops/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ..
      dockerfile: devops/docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    depends_on:
      - ai-service
    volumes:
      - backend-data:/app/uploads
    networks:
      - app-network

  ai-service:
    build:
      context: ..
      dockerfile: devops/docker/Dockerfile.ai_service
    ports:
      - "5050:5050"
    networks:
      - app-network

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
